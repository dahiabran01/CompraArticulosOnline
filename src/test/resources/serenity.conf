serenity {
    project.name = "Automation Exercise | Screenplay"
    test.root = "co.com.equipo.certificacion.automationexercise"
    take.screenshots = FOR_EACH_ACTION
    restart.browser.for.each = example
}

webdriver {
    driver = chrome
    autodownload = false
    wait.for.timeout = 10000
    timeouts.implicitlywait = 0
    capabilities {
        browserName = chrome
        "goog:chromeOptions" {
            # Ads can interrupt navigation with a #google_vignette interstitial.
            args = [
                "--window-size=1440,900",
                "--incognito",
                "--host-resolver-rules=MAP *.googlesyndication.com ~NOTFOUND, MAP *.doubleclick.net ~NOTFOUND"
            ]
        }
    }
}

headless.mode = false
