serenity {
    project.name = "Automation Exercise | Screenplay"
    test.root = "co.com.equipo.certificacion.automationexercise"
    take.screenshots = FOR_EACH_ACTION
    restart.browser.for.each = scenario
}

webdriver {
    driver = chrome
    autodownload = false
    wait.for.timeout = 10000
    timeouts.implicitlywait = 0
    capabilities {
        browserName = chrome
        "goog:chromeOptions" {
            args = ["--window-size=1440,900", "--incognito"]
        }
    }
}

headless.mode = false
