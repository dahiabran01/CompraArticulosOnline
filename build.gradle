plugins {
    id 'io.github.jumosqu12.screenplayarchitecture' version '2.0.1'
    id 'java'
    id 'net.serenity-bdd.serenity-gradle-plugin' version '4.1.3'
}

group = 'co.com.equipo.certificacion'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

def serenityVersion = '4.1.3'

dependencies {
    implementation "net.serenity-bdd:serenity-screenplay:${serenityVersion}"
    implementation "net.serenity-bdd:serenity-screenplay-webdriver:${serenityVersion}"
    testImplementation "net.serenity-bdd:serenity-cucumber:${serenityVersion}"
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.hamcrest:hamcrest:2.2'
    testRuntimeOnly 'org.slf4j:slf4j-simple:2.0.5'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

def selectedRunner = providers.gradleProperty('runner').orElse('AutomationExerciseRunner')

def configureE2E = { Test task ->
    task.group = 'verification'
    task.testClassesDirs = sourceSets.test.output.classesDirs
    task.classpath = sourceSets.test.runtimeClasspath
    task.useJUnit()
    System.properties.each { key, value ->
        if (key.startsWith('cucumber.') || key.startsWith('webdriver.') ||
                key.startsWith('serenity.') || key.startsWith('progress.') ||
                key == 'demo.delay' || key == 'headless.mode') {
            task.systemProperty key, value
        }
    }
    task.jvmArgs '-Dfile.encoding=UTF-8'
    task.outputs.upToDateWhen { false }
    task.testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat = 'full'
        showStandardStreams = true
    }
}

tasks.named('test', Test) {
    configureE2E(it)
    filter {
        includeTestsMatching "*.${selectedRunner.get()}"
    }
    if (!Boolean.getBoolean('cucumber.execution.dry-run')) {
        finalizedBy 'aggregate'
    }
}

tasks.register('demo', Test) {
    description = 'Runs the two end-to-end purchase scenarios with visible demo pauses and generates the Serenity report.'
    dependsOn 'clearReports'
    configureE2E(it)
    filter {
        includeTestsMatching '*.PurchaseRunner'
    }
    systemProperty 'demo.delay', System.getProperty('demo.delay', '1500')
    finalizedBy 'aggregate'
}

tasks.register('unitTest', Test) {
    description = 'Runs pure unit tests without launching a browser.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnit()
    filter {
        includeTestsMatching '*Test'
    }
    jvmArgs '-Dfile.encoding=UTF-8'
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat = 'full'
    }
}

tasks.named('check') {
    dependsOn 'unitTest'
}

tasks.named('clean') {
    delete layout.projectDirectory.dir('target')
}

serenity {
    generateOutcomes = true
}
